name: publish TG Access posts

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgaccess-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: publish due posts
        env:
          IG_USER_ID: "17841456768761198"
          FB_PAGE_ID: "1357468380793691"
          META_TOKEN: ${{ secrets.META_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: "324285499"
        run: python publish.py
      - name: save state
        if: always()
        run: |
          git config user.name "tgaccess-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: update published posts" && git pull --rebase && git push)
